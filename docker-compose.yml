version: '3.8'

services:
  agent_trace_gw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_trace_gw
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - agent_trace_data:/app/.agent_trace
    environment:
      - RUST_LOG=info
      - AGENT_TRACE_BIND=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  agent_trace_data:
    driver: local
