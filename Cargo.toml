[package]
name = "agent_trace_gw"
version = "0.1.0"
edition = "2021"
authors = ["Milos"]
license = "MIT"
description = "High-performance Rust telemetry gateway & reverse proxy for distributed AI agent clusters"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7.5", features = ["macros", "ws"] }
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12.5", default-features = false, features = ["stream", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.8", features = ["v4", "serde"] }
async-stream = "0.3"
hex = "0.4"
ring = "0.17"

[dev-dependencies]
tempfile = "3"
